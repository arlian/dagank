name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job reads the repo and publishes to Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait, not race. Never cancel one mid-flight, or Pages
# can be left serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate. A shop running this offline cannot be sent a hotfix, so a
      # broken build must never reach Pages in the first place.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
